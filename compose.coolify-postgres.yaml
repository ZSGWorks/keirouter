name: keirouter

services:
  keirouter:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${KEIROUTER_VERSION:-dev}
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:20180:20180"
    environment:
      KEIROUTER_DATA__DIR: /data
      KEIROUTER_HEADROOM_RUNTIME: compose
      KEIROUTER_SERVER__HOST: 0.0.0.0
      KEIROUTER_SERVER__PORT: 20180
      KEIROUTER_SECURITY__BIND_LOOPBACK_ONLY: ${KEIROUTER_BIND_LOOPBACK_ONLY:-false}
      KEIROUTER_SECURITY__TRUST_FORWARDED_HEADERS: ${KEIROUTER_TRUST_FORWARDED_HEADERS:-true}
      KEIROUTER_SECURITY__MASTER_KEY: ${KEIROUTER_MASTER_KEY:?set master key}
      KEIROUTER_DATABASE__DRIVER: postgres
      KEIROUTER_DATABASE__DSN: ${KEIROUTER_DATABASE__DSN:?set postgres DSN}
      KEIROUTER_LOG__FORMAT: ${KEIROUTER_LOG_FORMAT:-json}
      KEIROUTER_SECURITY__ALLOW_PRIVATE_BASE_URL: ${KEIROUTER_SECURITY__ALLOW_PRIVATE_BASE_URL:-false}
      # Lockout recovery: set RESET_PWD=true in Coolify env vars, redeploy, log
      # in with the default password, change it, then remove the variable.
      KEIROUTER_SECURITY__RESET_PASSWORD: ${KEIROUTER_RESET_PWD:-false}
    volumes:
      - keirouter-data:/data
    depends_on:
      headroom:
        condition: service_healthy
    networks:
      - coolify
      - headroom

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:0.36.0
    entrypoint: ["headroom", "proxy"]
    command: ["--host", "0.0.0.0", "--port", "8787"]
    restart: unless-stopped
    environment:
      HOME: /tmp/headroom-home
      HEADROOM_HOST: 0.0.0.0
      # Headroom is reachable only through its dedicated shared network; no
      # host port is published. It retains controlled outbound access for a
      # cold compression-model download.
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      HEADROOM_WORKSPACE_DIR: /tmp/headroom-home/.headroom
      HEADROOM_CONFIG_DIR: /tmp/headroom-home/.headroom/config
      HF_HOME: /tmp/headroom-home/.headroom/huggingface
    volumes:
      - headroom-data:/tmp/headroom-home/.headroom
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/readyz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - headroom

networks:
  coolify:
    external: true
  headroom: {}

volumes:
  keirouter-data:
  headroom-data:

name: keirouter

services:
  keirouter:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        # Stamp the binary with a real version. Set KEIROUTER_VERSION to your
        # release tag (e.g. v0.1.6) when building; defaults to "dev" otherwise.
        VERSION: ${KEIROUTER_VERSION:-dev}
        # Coolify auto-injects SOURCE_COMMIT (deployed git SHA). When no explicit
        # VERSION is given, the Dockerfile falls back to this so the dashboard
        # shows the commit instead of "dev".
        SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    restart: unless-stopped
    ports:
      - "${KEIROUTER_PORT:-20180}:20180"
    volumes:
      - keirouter-data:/data
    environment:
      KEIROUTER_DATA__DIR: /data
      KEIROUTER_HEADROOM_RUNTIME: compose
      KEIROUTER_SERVER__HOST: 0.0.0.0
      KEIROUTER_SERVER__PORT: 20180
      KEIROUTER_SECURITY__BIND_LOOPBACK_ONLY: ${KEIROUTER_BIND_LOOPBACK_ONLY:-false}
      KEIROUTER_SECURITY__ALLOW_PRIVATE_BASE_URL: ${KEIROUTER_SECURITY__ALLOW_PRIVATE_BASE_URL:-false}
      KEIROUTER_SECURITY__TRUST_FORWARDED_HEADERS: ${KEIROUTER_TRUST_FORWARDED_HEADERS:-true}
      KEIROUTER_SECURITY__MASTER_KEY: ${KEIROUTER_MASTER_KEY:-}
      KEIROUTER_LOG__FORMAT: ${KEIROUTER_LOG_FORMAT:-json}
    depends_on:
      headroom:
        condition: service_healthy
    networks:
      - default
      - headroom

  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:0.37.0
    entrypoint: ["headroom", "proxy"]
    command: ["--host", "0.0.0.0", "--port", "8787"]
    restart: unless-stopped
    environment:
      HOME: /tmp/headroom-home
      HEADROOM_HOST: 0.0.0.0
      # Headroom is reachable only through its dedicated shared network; no
      # host port is published. It retains controlled outbound access for a
      # cold compression-model download.
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      HEADROOM_WORKSPACE_DIR: /tmp/headroom-home/.headroom
      HEADROOM_CONFIG_DIR: /tmp/headroom-home/.headroom/config
      HF_HOME: /tmp/headroom-home/.headroom/huggingface
      # CPU-only performance tuning (no steady-state RSS growth). ONNX CPU
      # arena and thread-spinning are deliberately left off: the arena retains
      # memory and spinning pegs idle CPU. Embedding BLAS/OpenMP threads are
      # already capped at 1 by Headroom itself. See deploy/README.md.
      HEADROOM_KOMPRESS_BACKEND: "onnx"
      HEADROOM_KOMPRESS_ONNX_FILENAME: "onnx/kompress-int8-wo.onnx"
      HEADROOM_KOMPRESS_ONNX_INTER_THREADS: "1"
      # Empty default keeps ONNX Runtime's automatic intra-op thread choice
      # (physical cores), so the image stays portable across hosts.
      HEADROOM_KOMPRESS_ONNX_INTRA_THREADS: "${KEIROUTER_HEADROOM_KOMPRESS_INTRA_THREADS:-}"
      HEADROOM_KOMPRESS_MAX_CONCURRENT: "1"
      HEADROOM_COMPRESSION_MAX_WORKERS: "6"
    volumes:
      - headroom-data:/tmp/headroom-home/.headroom
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/readyz', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - headroom

networks:
  headroom: {}

volumes:
  keirouter-data:
  headroom-data:

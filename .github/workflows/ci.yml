name: CI

on:
  pull_request:
    types: [edited, opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Areas
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deployment: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - '.github/workflows/ci.yml'
              - 'backend/**'
              - 'go.work'
              - 'go.work.sum'
            frontend:
              - '.github/workflows/ci.yml'
              - 'frontend/**'
            deployment:
              - '.github/workflows/ci.yml'
              - '.dockerignore'
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - 'compose.yaml'
              - 'compose.postgres.yaml'
              - 'compose.coolify-postgres.yaml'

  backend:
    name: Backend
    runs-on: [self-hosted, linux, x64]
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download Go modules
        working-directory: backend
        run: go mod download

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Test
        working-directory: backend
        run: go test ./...

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: [self-hosted, linux, x64]
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: keirouter_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d keirouter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test PostgreSQL compatibility
        working-directory: backend
        env:
          KEIROUTER_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/keirouter_test?sslmode=disable
        run: go test ./internal/store -run TestPostgresCompatibility -count=1 -v

  frontend:
    name: Frontend
    runs-on: [self-hosted, linux, x64]
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  deployment:
    name: Deployment Build
    runs-on: [self-hosted, linux, x64]
    needs: changes
    if: needs.changes.outputs.deployment == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Validate default Compose file
        run: docker compose -f compose.yaml config

      - name: Validate Postgres Compose override
        run: docker compose -f compose.yaml -f compose.postgres.yaml config

      - name: Validate Coolify Postgres Compose
        env:
          KEIROUTER_MASTER_KEY: test-master-key
          KEIROUTER_DATABASE__DSN: postgres://user:password@postgres:5432/keirouter?sslmode=disable
        run: docker compose -f compose.coolify-postgres.yaml config

      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t keirouter:test .
